name: Deploy to OCI Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/ubuntu/uber-tax-bot
            git pull origin main
            /home/ubuntu/.local/bin/uv pip install -r requirements.txt -p .venv
            sudo cp /home/ubuntu/uber-tax-bot/deploy/uber-tax-web.service /etc/systemd/system/uber-tax-web.service
            sudo systemctl daemon-reload
            sudo systemctl enable --now uber-tax-web.service
            sudo systemctl restart uber-tax-bot.service
            sudo systemctl restart uber-tax-web.service
            sudo systemctl is-active uber-tax-bot.service
            sudo systemctl is-active uber-tax-web.service
